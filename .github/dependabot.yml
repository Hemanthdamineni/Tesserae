version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-minor:
        dependency-type: production
        update-types: ['minor', 'patch']
      development-minor:
        dependency-type: development
        update-types: ['minor', 'patch']
    ignore:
      # Majors change test/config semantics (Vitest 5, ESLint 10, Astro 7 …);
      # do them deliberately rather than by an automated PR. Minor and patch
      # updates are still raised, grouped, and run through CI.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      # A breaking action major can break deploy on a day nobody is looking.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
